<body>
  

<section>
    <div class="holdsignupdiv">
        <div class="carrysignupdiv">
            <img src="images/signup-login.jpg" class="signup_image" alt="lady using SHOPIT app">

            <div class="logindiv">
                <div class="verifywe">
                    <h1>Verify your Account</h1>
                    <p>Please we have sent a verification code to +2349089****000</p>

                        
                            <div class="holdemailall">
                                <form action="#" method="POST">
                                    <input type="text" name="code" maxlength="1" class="code_input" autofocus>

                                    <input type="text" name="code" maxlength="1" class="code_input">

                                    <input type="text" name="code" maxlength="1" class="code_input">

                                    <input type="text" name="code" maxlength="1" class="code_input">


                                    <button type="submit" name="proceed">Submit</button>
                                </form>
                            </div>

                            <!-- javascript code to make input move focus to the next input -->
                             <script>
                                const inputs = document.querySelectorAll('input[type="text"]');

                                inputs.forEach((input, index) => {
                                    input.addEventListener('input', () => {
                                        if (input.value.length === 1 && index < inputs.length -1){
                                            inputs[index + 1].focus();
                                        }
                                    });
                                    input.addEventListener('keydown', (e) => {
                                        if (e.key === 'Backspace' && input.value.length === 0 && index > 0){
                                            inputs[index - 1].focus();
                                        }
                                    });
                                });
                            </script>
                             <!-- javascript code to make input move focus to the next input ends here -->
                        </div>

                   
                       
                    
                    

                </div>

            </div>
        </div>
    </div>
</section>
