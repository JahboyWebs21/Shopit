<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="images/shopit_logo.png">
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>LOGIN</title>
</head>
<body>
  

<section>
    <div class="holdsignupdiv">
        <div class="carrysignupdiv">
            <img src="images/signup-login.jpg" class="signup_image" alt="lady using SHOPIT app">

            <div class="logindiv">
                <div class="carrylogindiv">
                    <h1>Welcome to Shopit</h1>
                    <p>Enter your e-mail or phone number to log in.</p>

                    <form action="#" method="POST">
                        <label>Email or Mobile Number*</label>
                        <div class="holdemail">
                            <input type="email" name="email" placeholder="stephenmichaeloko000@gmail.com">
                        </div>

                        <button type="submit" name="continue">Continue</button>
                        By proceeding you agree to Shopit <href="#">Terms and Conditions Privacy Policy</a>
                        
                    </form>

                    <nav>
                        <li>Log in with Google</li>
                        <li>Log in with Facebook</li>
                    </nav>

                    <p>Kindly visit <a href="#">Help Center or contact our customer Service team.</a></p>
                </div>
                


            </div>
        </div>
    </div>
</section>
</body>
</html>
