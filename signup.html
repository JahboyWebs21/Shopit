<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/shopit_logo.png">
    <script src="js/script.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>SIGNUP</title>
</head>
<body>
  

<section>
    <div class="holdsignupdiv">
        <div class="carrysignupdiv">
            <img src="images/signup-login.jpg" class="signup_image" alt="lady using SHOPIT app">

            <div class="logindiv">
                <div class="carrylogindivsss">
                    <h1>Welcome to Shopit</h1>
                    <p>Enter your detials to continue.</p>

                    <form action="#" method="POST">
                        <label>Email or Mobile Number*</label>
                        <div class="holdus">
                            <input type="text" name="name" placeholder="Your full name">
                        </div>

                         <div class="holdus">
                            <input type="phone" name="phone" placeholder="Mobile number">
                        </div>


                         <div class="holdus">
                            <input type="email" name="email" placeholder="Valid email-address">
                        </div>

                        <div class="holdus">
                            <input type="password" name="password" placeholder="Password">
                        </div>

                        <div class="holdus">
                            <input type="confirm_password" name="email" placeholder="Confirm password">
                        </div>
                        <button type="submit" name="continue">Continue</button>
                        By proceeding you agree to Shopit <href="#">Terms and Conditions Privacy Policy</a>
                        
                    </form>

                </div>
                


            </div>
        </div>
    </div>
</section>
</body>
</html>
