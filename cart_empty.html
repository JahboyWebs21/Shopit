<!-- javascript code to display mobile menu starts here -->
 
    <script>

        function displaymobmenu(){
            const carrymobilemenu=document.querySelector('.carrymobilemenu')
            carrymobilemenu.style.display='block'
            mobicons.style.display='none'
            mobiconsx.style.display='inline-table'
          }
        
        //   hidemobile menu div
        function hidemobmenu(){
            const carrymobilemenu=document.querySelector('.carrymobilemenu')
            carrymobilemenu.style.display='none'
            mobiconsx.style.display='none'
            mobicons.style.display='inline-table'
        }
    </script>
<!--javascript code to display mobile menu ends here  -->
